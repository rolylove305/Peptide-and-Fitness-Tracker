name: AAA BioTrack V5 Typecheck Diagnostics

on:
  push:
    branches:
      - agent/v5-sync-foundation

permissions:
  contents: read

jobs:
  typecheck-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Run concise TypeScript diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          git clone --quiet --depth 1 --branch agent/v5-sync-foundation \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo/v5
          npm ci --silent >/dev/null 2>&1
          npm run typecheck
