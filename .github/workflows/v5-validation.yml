name: BioTrack V5 Validation

on:
  pull_request:
    branches:
      - validation/v5-ci
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  verify-v5:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/v5-sync-foundation'
    runs-on: ubuntu-latest

    steps:
      - name: Check out V5 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'agent/v5-sync-foundation' }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Generate reproducible lockfile
        working-directory: v5
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply verified TypeScript narrowing fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('v5/src/features/workout/ProgressionDashboard.tsx')
          text = path.read_text()
          start = text.index('  async function submit() {')
          end = text.index('\n  const proposedWeightValue', start)
          block = text[start:end]

          if 'const target = selected;' not in block:
              block = block.replace(
                  "  async function submit() {\n    setError(null);",
                  "  async function submit() {\n    const target = selected;\n    if (!target) {\n      setError('Select a saved routine target before applying this change.');\n      return;\n    }\n\n    setError(null);",
                  1,
              )
              block = block.replace('selected.', 'target.')
              text = text[:start] + block + text[end:]
              path.write_text(text)
          PY

      - name: Commit lockfile and narrowing fix to V5 branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v5/package-lock.json v5/src/features/workout/ProgressionDashboard.tsx
          if git diff --cached --quiet; then
            echo "Generated files and fix already match."
          else
            git commit -m "Fix V5 type narrowing and lock dependencies"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Install locked dependencies
        working-directory: v5
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Capture TypeScript diagnostics
        id: typecheck
        working-directory: v5
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biotrack-v5-typecheck
          path: v5/typecheck.log
          if-no-files-found: error
          retention-days: 14

      - name: Build V5 preview
        if: steps.typecheck.outputs.status == '0'
        working-directory: v5
        run: npm run build

      - name: Upload V5 preview artifact
        if: steps.typecheck.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: biotrack-v5-preview
          path: v5/dist
          if-no-files-found: error
          retention-days: 14

      - name: Fail when TypeScript reports errors
        if: steps.typecheck.outputs.status != '0'
        run: exit 1
