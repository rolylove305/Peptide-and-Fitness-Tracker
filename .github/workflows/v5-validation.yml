name: BioTrack V5 Validation

on:
  pull_request:
    branches:
      - validation/v5-ci
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-v5:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/v5-sync-foundation'
    runs-on: ubuntu-latest

    steps:
      - name: Check out V5 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'agent/v5-sync-foundation' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: v5/package-lock.json

      - name: Install locked dependencies
        working-directory: v5
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check V5
        working-directory: v5
        run: npm run typecheck

      - name: Build functional V5 preview
        working-directory: v5
        env:
          VITE_SUPABASE_URL: https://gfuazkuohrragkthtumz.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_HJNw6TpNJ0YwTo4rEME6zg_Gbp1xtGU
        run: npm run build

      - name: Upload V5 preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: biotrack-v5-preview
          path: v5/dist
          if-no-files-found: error
          retention-days: 14
