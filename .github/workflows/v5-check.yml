name: BioTrack V5 Check

on:
  push:
    branches:
      - agent/v5-sync-foundation
    paths:
      - 'v5/**'
      - 'supabase/migrations/**'
      - '.github/workflows/v5-check.yml'
  pull_request:
    paths:
      - 'v5/**'
      - 'supabase/migrations/**'
      - '.github/workflows/v5-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v5:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: v5/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check V5
        run: npm run typecheck

      - name: Build V5
        env:
          VITE_SUPABASE_URL: https://gfuazkuohrragkthtumz.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_HJNw6TpNJ0YwTo4rEME6zg_Gbp1xtGU
        run: npm run build

      - name: Upload V5 preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: biotrack-v5-preview
          path: v5/dist
          if-no-files-found: error
          retention-days: 14
