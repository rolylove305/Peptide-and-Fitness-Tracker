name: BioTrack V5 Check

on:
  push:
    branches:
      - agent/v5-sync-foundation
    paths:
      - 'v5/**'
      - 'supabase/migrations/**'
      - '.github/workflows/v5-check.yml'
  pull_request:
    paths:
      - 'v5/**'
      - 'supabase/migrations/**'
      - '.github/workflows/v5-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-v5:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: v5/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check V5
        run: npm run typecheck

      - name: Write public preview configuration
        run: |
          cat > .env.production <<'EOF'
          VITE_SUPABASE_URL=https://gfuazkuohrragkthtumz.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_HJNw6TpNJ0YwTo4rEME6zg_Gbp1xtGU
          EOF

      - name: Build V5
        run: npm run build

      - name: Verify preview configuration
        run: |
          grep -R -F -q 'gfuazkuohrragkthtumz' dist/assets/*.js
          grep -R -F -q 'sb_publishable_HJNw6TpNJ0YwTo4rEME6zg_Gbp1xtGU' dist/assets/*.js

      - name: Publish temporary preview build branch
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 8
        working-directory: .
        env:
          PREVIEW_BRANCH: temp/v5-built-preview
        run: |
          rm -rf /tmp/biotrack-v5-dist
          cp -R v5/dist /tmp/biotrack-v5-dist
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan "$PREVIEW_BRANCH"
          git rm -rf --ignore-unmatch .
          git clean -fdx
          cp -R /tmp/biotrack-v5-dist/. .
          find . -type f -not -path './.git/*' | sort > preview-manifest.txt
          git add -A
          git commit -m "Build BioTrack V5 preview ${GITHUB_SHA}"
          git push --force origin HEAD:"refs/heads/${PREVIEW_BRANCH}"

      - name: Upload V5 preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: biotrack-v5-preview
          path: v5/dist
          if-no-files-found: error
          retention-days: 14
