name: BioTrack V5 Check

on:
  push:
    branches:
      - agent/v5-sync-foundation
    paths:
      - 'v5/**'
      - 'supabase/migrations/**'
      - '.github/workflows/v5-check.yml'
  pull_request:
    paths:
      - 'v5/**'
      - 'supabase/migrations/**'
      - '.github/workflows/v5-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v5:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: v5/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format check V5
        run: npm run format:check

      - name: Lint V5
        run: npm run lint:ci

      - name: Test recovery protections
        run: npm test

      - name: Type-check V5
        run: npm run typecheck

      - name: Write public preview configuration
        run: |
          cat > .env.production <<'EOF'
          VITE_SUPABASE_URL=https://gfuazkuohrragkthtumz.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_HJNw6TpNJ0YwTo4rEME6zg_Gbp1xtGU
          EOF

      - name: Build V5
        run: npm run build

      - name: Verify preview configuration, icons and PWA shell
        run: |
          grep -R -F -q 'gfuazkuohrragkthtumz' dist/assets/*.js
          grep -R -F -q 'sb_publishable_HJNw6TpNJ0YwTo4rEME6zg_Gbp1xtGU' dist/assets/*.js
          grep -R -F -q '/sw.js' dist/assets/*.js
          test -f dist/manifest.json
          test -f dist/sw.js
          test -f dist/biotrack-icon.svg
          test -f dist/apple-touch-icon.png
          test ! -f dist/apple-touch-icon.png.base64
          node scripts/verify-png.mjs dist/apple-touch-icon.png 180 180
          grep -F -q '"id": "/"' dist/manifest.json
          grep -F -q 'biotrack-v5-' dist/sw.js
          grep -F -q './apple-touch-icon.png' dist/index.html

      - name: Upload V5 preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: biotrack-v5-preview
          path: v5/dist
          if-no-files-found: error
          retention-days: 14
